{% extends "base.html" %}

{% block extra_css %}
<style>
#register-screen {
    max-width: 400px;
    margin: 0 auto;
}

#register-form input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

#register-form input:focus {
    outline: none;
    border-color: #667eea;
}

#register-form button {
    width: 100%;
    margin-bottom: 10px;
    background: #667eea;
    color: white;
}

#register-form button:hover {
    background: #5568d3;
}

#back-btn {
    background: #999 !important;
}

#back-btn:hover {
    background: #777 !important;
}
</style>
{% endblock %}

{% block content %}
<div id="register-screen">
    <h2>Create Account</h2>
    <div id="register-form">
        <input type="text" id="username-input" placeholder="Enter username" maxlength="20">
        <input type="password" id="password-input" placeholder="Enter password" maxlength="50">
        <input type="password" id="confirm-password-input" placeholder="Confirm password" maxlength="50">
        <button id="register-btn">Create Account</button>
        <button id="back-btn">Back to Login</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
