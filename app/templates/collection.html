{% extends "base.html" %}

{% block title %}My Collection - Art Quiz{% endblock %}

{% block content %}
<div id="collection-container">
    <div id="collection-empty" style="text-align: center; padding: 50px;">
        <h2>Your Collection is Empty</h2>
        <p>Add items to your collection by browsing artworks and saving your favorites!</p>
    </div>
    <div id="collection-grid" style="display: none;">
        <div id="collection-thumbnails"></div>
    </div>
    <div id="collection-detail" style="display: none;">
        <button id="back-to-grid-btn">← Back to Grid</button>
        <div id="collection-artwork">
            <img id="collection-image" alt="Artwork">
            <div id="collection-info">
                <h2 id="collection-title"></h2>
                <p id="collection-artist"></p>
                <p id="collection-year"></p>
                <p id="collection-museum"></p>
                <p id="collection-art-type"></p>
                <p id="collection-material"></p>
                <p id="collection-movement"></p>
            </div>
        </div>
        <div id="collection-navigation">
            <button id="prev-collection-btn">Previous Artwork</button>
            <button id="next-collection-btn">Next Artwork</button>
            <button id="remove-from-collection-btn">Remove from Collection</button>
        </div>
    </div>
    <button id="collection-back-btn">Back to Menu</button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/collection.js') }}"></script>
{% endblock %}
